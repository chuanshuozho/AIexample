<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>知识库管理 - AI 全能助手</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .knowledge-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid #4b5563;
        }
        
        .page-title {
            font-size: 24px;
            font-weight: 600;
            color: #f9fafb;
        }
        
        .back-link {
            color: #9ca3af;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .back-link:hover {
            color: #f9fafb;
        }
        
        .upload-section {
            background: #212121;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 30px;
        }
        
        .upload-area {
            border: 2px dashed #4b5563;
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .upload-area:hover {
            border-color: #10a37f;
            background: rgba(16, 163, 127, 0.05);
        }
        
        .upload-area.dragover {
            border-color: #10a37f;
            background: rgba(16, 163, 127, 0.1);
        }
        
        .upload-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }
        
        .upload-text {
            color: #9ca3af;
            font-size: 16px;
            margin-bottom: 8px;
        }
        
        .upload-hint {
            color: #6b7280;
            font-size: 14px;
        }
        
        .upload-progress {
            display: none;
            margin-top: 20px;
        }
        
        .progress-bar {
            width: 100%;
            height: 8px;
            background: #374151;
            border-radius: 4px;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            background: #10a37f;
            width: 0%;
            transition: width 0.3s ease;
        }
        
        .documents-section {
            background: #212121;
            border-radius: 12px;
            padding: 20px;
        }
        
        .section-title {
            font-size: 18px;
            font-weight: 600;
            color: #f9fafb;
            margin-bottom: 20px;
        }
        
        .document-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .document-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px;
            background: #2f2f2f;
            border-radius: 8px;
            transition: background 0.2s ease;
        }
        
        .document-item:hover {
            background: #383838;
        }
        
        .document-info {
            display: flex;
            align-items: center;
            gap: 16px;
            flex: 1;
        }
        
        .document-icon {
            width: 40px;
            height: 40px;
            background: #374151;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }
        
        .document-details {
            flex: 1;
        }
        
        .document-name {
            color: #f9fafb;
            font-size: 15px;
            font-weight: 500;
            margin-bottom: 4px;
        }
        
        .document-meta {
            color: #6b7280;
            font-size: 13px;
        }
        
        .document-status {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .status-badge {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
        }
        
        .status-completed {
            background: rgba(16, 163, 127, 0.2);
            color: #10a37f;
        }
        
        .status-processing {
            background: rgba(234, 179, 8, 0.2);
            color: #eab308;
        }
        
        .status-failed {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
        }
        
        .status-pending {
            background: rgba(107, 114, 128, 0.2);
            color: #9ca3af;
        }
        
        .document-actions {
            display: flex;
            gap: 8px;
        }
        
        .btn {
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            border: none;
            transition: all 0.2s ease;
        }
        
        .btn-primary {
            background: #10a37f;
            color: white;
        }
        
        .btn-primary:hover {
            background: #0d8a6a;
        }
        
        .btn-danger {
            background: transparent;
            color: #ef4444;
            border: 1px solid #ef4444;
        }
        
        .btn-danger:hover {
            background: rgba(239, 68, 68, 0.1);
        }
        
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #6b7280;
        }
        
        .empty-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }
        
        /* Modal styles */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        
        .modal.show {
            display: flex;
        }
        
        .modal-content {
            background: #212121;
            border-radius: 12px;
            padding: 24px;
            max-width: 400px;
            width: 90%;
        }
        
        .modal-title {
            font-size: 18px;
            font-weight: 600;
            color: #f9fafb;
            margin-bottom: 16px;
        }
        
        .modal-text {
            color: #9ca3af;
            margin-bottom: 24px;
        }
        
        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
        }
        
        .btn-secondary {
            background: transparent;
            color: #9ca3af;
            border: 1px solid #4b5563;
        }
        
        .btn-secondary:hover {
            background: #374151;
        }
    </style>
</head>
<body>
    <div class="knowledge-container">
        <div class="page-header">
            <h1 class="page-title">知识库管理</h1>
            <a href="index.html" class="back-link">
                <span>←</span>
                <span>返回聊天</span>
            </a>
        </div>
        
        <div class="upload-section">
            <div class="upload-area" id="dropZone">
                <div class="upload-icon">📁</div>
                <p class="upload-text">拖拽文件到此处或点击上传</p>
                <p class="upload-hint">支持 PDF、TXT、MD、DOCX 格式，最大 10MB</p>
                <input type="file" id="fileInput" accept=".pdf,.txt,.md,.docx" multiple hidden>
            </div>
            <div class="upload-progress" id="uploadProgress">
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <p class="upload-text" style="margin-top: 8px;">上传中...</p>
            </div>
        </div>
        
        <div class="documents-section">
            <h2 class="section-title">文档列表</h2>
            <div class="document-list" id="documentList">
                <!-- Documents will be loaded here -->
            </div>
        </div>
    </div>
    
    <!-- Delete Confirmation Modal -->
    <div class="modal" id="deleteModal">
        <div class="modal-content">
            <h3 class="modal-title">确认删除</h3>
            <p class="modal-text">确定要删除这个文档吗？此操作不可撤销。</p>
            <div class="modal-actions">
                <button class="btn btn-secondary" id="cancelDelete">取消</button>
                <button class="btn btn-danger" id="confirmDelete">删除</button>
            </div>
        </div>
    </div>
    
    <script src="js/knowledge.js"></script>
</body>
</html>
